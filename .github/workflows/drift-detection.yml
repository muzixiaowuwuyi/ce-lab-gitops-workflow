name: Drift Detection

on:
  schedule:
    - cron: "0 2 * * *" # Triggers automatically every day at 02:00 UTC
  workflow_dispatch: # Allows manual triggering via the GitHub Web UI for testing

permissions:
  contents: read
  issues: write # Crucial: Allows the pipeline to automatically create an Issue when drift is discovered

env:
  TF_VERSION: latest # Always use the latest Terraform version for accurate drift detection

jobs:
  detect-drift:
    name: Check ${{ matrix.environment }} for drift
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod] # Uses a matrix to run health checks for both environments in parallel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Dynamically select branch: 'main' for the prod environment, 'develop' for the dev environment
          ref: ${{ matrix.environment == 'prod' && 'main' || 'develop' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2 # Using a secure plugin version
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="key=m5-03-gitops/${{ matrix.environment }}/terraform.tfstate"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Plan (detect drift)
        id: plan
        # Core flag: -detailed-exitcode
        # Normally, a plan with no changes exits with 0.
        # If the cloud infrastructure drifts from the code, the exit code changes to 2!
        run: |
          terraform plan \
            -var-file=environments/${{ matrix.environment }}/terraform.tfvars \
            -input=false \
            -no-color \
            -detailed-exitcode
        continue-on-error: true # Prevents the pipeline from crashing when the exit code is 2 (indicating drift)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Open Issue on Drift
        # Triggers only if the plan outcome is 'failure' (exit code is non-zero, meaning drift was found)
        if: steps.plan.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const env = "${{ matrix.environment }}";
            const title = `🚨 Warning: Infrastructure Drift Detected in [${env}]`;
            const body = `## 🔍 Drift Detected in \`${env}\` Environment

            The automated inspection has detected that the actual state of your AWS cloud resources has drifted from the configuration defined in the Git repository!

            **Affected Environment:** ${env}
            **Target Branch:** ${{ matrix.environment == 'prod' && 'main' || 'develop' }}
            **Inspection Log:** [View Run Details](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

            ### 👨‍💻 Troubleshooting Guide:
            1. Click the log link above and inspect the \`Terraform Plan\` section to check the exact differences.
            2. **If it was an accidental manual change**: Re-run the deploy pipeline for this branch to overwrite and fix the cloud resources using the code base.
            3. **If it was an intentional emergency hotfix**: Update your local \`.tf\` code immediately to match the real-world state and bring them back into alignment.

            /cc @${context.repo.owner}`;

            // Call the GitHub API to automatically create a tagged issue
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ["drift", env]
            });
